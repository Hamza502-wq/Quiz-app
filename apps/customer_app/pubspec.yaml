name: doorstep_customer
description: "DoorStep Zimbabwe customer app — order food, groceries, pharmacy and parcels."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  doorstep_core:
    path: ../../packages/doorstep_core
  provider: ^6.1.5+1
  google_maps_flutter: ^2.18.2
  geolocator: ^14.1.0
  url_launcher: ^6.3.2
  intl: ^0.20.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "../../brand/app-icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "../../brand/app-icon-foreground.png"
  remove_alpha_ios: true
