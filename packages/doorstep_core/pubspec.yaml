name: doorstep_core
description: "Shared API client, auth, theme, models and widgets for the DoorStep Zimbabwe apps"
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

dependencies:
  cached_network_image: ^4.0.2
  dio: ^5.11.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  socket_io_client: ^3.1.6
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/brand/
  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
          weight: 400
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
        - asset: fonts/Poppins-ExtraBold.ttf
          weight: 800
