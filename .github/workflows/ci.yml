name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck, tests, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doorstep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/doorstep_test?schema=public
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/doorstep_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    name: Web dashboards (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck -w @doorstep/web-shared
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_TELEMETRY_DISABLED: 1

  flutter:
    name: Flutter apps (analyze, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: doorstep_core
        working-directory: packages/doorstep_core
        run: flutter pub get && flutter analyze && flutter test
      - name: customer_app
        working-directory: apps/customer_app
        run: flutter pub get && flutter analyze && flutter test
      - name: rider_app
        working-directory: apps/rider_app
        run: flutter pub get && flutter analyze && flutter test
